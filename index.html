<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>

  

  <body>
    <form class="calculator">
      <input type="text" class="calculator-screen" value="" readonly />
      <button type="button" class="daugiau">Daugiau</button>
      <div class="daugiau-mygtukai">
        <button type="button" class="special">^2</button>
        <button type="button" class="special">^n</button>
        <button type="button" class="special">√</button>
        <button type="button" class="special">1/x</button>
        <button type="button" class="special">lg</button>
      </div>
        <div class="mygtukai">
            <button type="button" class="mygtukas-clear">C</button>

            <button type="button" class="skaicius">7</button>
            <button type="button" class="skaicius">8</button>
            <button type="button" class="skaicius">9</button>
            <button type="button" class="operator">/</button>

            <button type="button" class="skaicius">4</button>
            <button type="button" class="skaicius">5</button>
            <button type="button" class="skaicius">6</button>
            <button type="button" class="operator">*</button>

            <button type="button" class="skaicius">1</button>
            <button type="button" class="skaicius">2</button>
            <button type="button" class="skaicius">3</button>
            <button type="button" class="operator">-</button>

            <button type="button" class="skaicius">.</button>
            <button type="button" class="skaicius">0</button>
            <button type="button" class="lygu">=</button>
            <button type="button" class="operator">+</button>
    </form>
    <script src="calculator.js"></script>
  </body>
</html>
