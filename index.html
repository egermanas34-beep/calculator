<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>
  <body>
    <form class="calculator">
      <input type="text" class="calculator-screen" value="" readonly />
      <div class="daugiau-mygtukai">
        <button type="button" class="mygtukas">^2</button>
        <button type="button" class="mygtukas">^n</button>
        <button type="button" class="mygtukas">√</button>
        <button type="button" class="mygtukas">1/x</button>
        <button type="button" class="mygtukas">lg</button>
      </div>
        <div class="mygtukai">
            <button type="button" class="mygtukas">C</button>

            <button type="button" class="mygtukas">7</button>
            <button type="button" class="mygtukas">8</button>
            <button type="button" class="mygtukas">9</button>
            <button type="button" class="mygtukas">/</button>

            <button type="button" class="mygtukas">4</button>
            <button type="button" class="mygtukas">5</button>
            <button type="button" class="mygtukas">6</button>
            <button type="button" class="mygtukas">*</button>

            <button type="button" class="mygtukas">1</button>
            <button type="button" class="mygtukas">2</button>
            <button type="button" class="mygtukas">3</button>
            <button type="button" class="mygtukas">-</button>

            <button type="button" class="mygtukas">.</button>
            <button type="button" class="mygtukas">0</button>
            <button type="button" class="mygtukas">=</button>
            <button type="button" class="mygtukas">+</button>
    </form>
  </body>
</html>
